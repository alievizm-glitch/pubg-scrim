        env:
          BOT_TOKEN: "9168083803:AAHPqnrfhll-y_PmMg7cTQ2YUlB_BV2SvQk"
          ADMIN_TG_ID: "8914582993"
          FIREBASE_DB_URL: "https://pubg-scrim-live-default-rtdb.firebaseio.com"
        run: timeout 270 node bot.js || true
